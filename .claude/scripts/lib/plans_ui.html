<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans</title>
<script>
(function(){try{var t=localStorage.getItem('plans.theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t)}}catch(e){}})();
</script>
<style>
:root{--bg:#f4f6f6;--panel:#fff;--rule:#d5dbdb;--ink:#1f2424;--muted:#566668;--ok:#17702f;--ok-bg:rgba(36,167,69,.12);--open:#a8480a;--hold:#0b6279;--hold-bg:rgba(34,211,238,.14);--defer:#7a5900;--defer-bg:rgba(240,193,90,.14);--danger:#a8222f;--danger-bg:#fdf0f1;--track:#e3e8e8;--radius:8px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a1a;--panel:#262626;--rule:#3a3a3a;--ink:#e8e8e8;--muted:#a3a3a3;--ok:#4ade80;--ok-bg:rgba(74,222,128,.12);--open:#fb923c;--hold:#22d3ee;--hold-bg:rgba(34,211,238,.12);--defer:#f0c15a;--defer-bg:rgba(240,193,90,.12);--danger:#f87171;--danger-bg:rgba(248,113,113,.12);--track:#3a3a3a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1a1a1a;--panel:#262626;--rule:#3a3a3a;--ink:#e8e8e8;--muted:#a3a3a3;--ok:#4ade80;--ok-bg:rgba(74,222,128,.12);--open:#fb923c;--hold:#22d3ee;--hold-bg:rgba(34,211,238,.12);--defer:#f0c15a;--defer-bg:rgba(240,193,90,.12);--danger:#f87171;--danger-bg:rgba(248,113,113,.12);--track:#3a3a3a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-wrap:anywhere}
a{color:var(--hold)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8125rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:1rem;border-bottom:1px solid var(--rule);background:var(--panel)}
h1{font-size:1.15rem;margin:0}
.ctl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
button,label.tog{min-height:2.75rem;padding:0 .9rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--open);outline-offset:2px}
label.tog:focus-within{outline:2px solid var(--open);outline-offset:2px}
label.tog input{width:1.1rem;height:1.1rem;margin:0}
label.tog input[type=date]{width:auto;height:auto;min-height:2.5rem;font:inherit;color:inherit;background:transparent;border:0;padding:0}
#rangeg{display:inline-flex;gap:.5rem;align-items:center;flex-wrap:wrap}
label.tog.on{border-color:var(--hold);box-shadow:inset 0 0 0 1px var(--hold)}
main{max-width:60rem;margin:0 auto;padding:1rem}
#live{margin-bottom:.5rem;min-height:1.5rem}
.banner{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.5rem .75rem;margin-top:.25rem;border:1px solid var(--danger);border-radius:var(--radius);background:var(--danger-bg);color:var(--danger)}
h2{font-size:1rem;margin:1.5rem 0 .5rem;display:flex;flex-wrap:wrap;gap:.25rem 1rem;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h3.grp{display:flex;align-items:center;gap:.6rem;font-size:.875rem;margin:1rem 0 .5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:.5rem;padding:.25rem 1rem .75rem}
a.prlink{font-weight:700}
a.prlink.prdone{font-weight:400;color:var(--muted)}
.about{margin:.25rem 0 .5rem;font-size:.9rem;line-height:1.5;color:var(--ink)}
.card{cursor:pointer}
.card .steps,.card .derr{cursor:auto}
.row1{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:center}
.cardbtn{border:0;background:transparent;padding:0;min-width:2.75rem;max-width:100%;text-align:left;overflow-wrap:anywhere;font-weight:600;gap:.5rem}
.cardbtn .nm{min-width:0;overflow-wrap:anywhere}
.chev{flex:none;width:.6rem;height:.6rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.cardbtn[aria-expanded="true"] .chev{transform:rotate(45deg)}
.pill{border:1px solid;border-radius:25px;padding:0 .5rem;font-size:.75rem;line-height:1.5}
#pillbar{display:none}
#pillbar .sep{flex:none;width:1px;background:var(--rule);margin:.25rem .125rem}
button.fpill{flex:none;min-height:2.25rem;padding:0 .9rem;border-radius:25px;font-size:.85rem;white-space:nowrap}
button.fpill[aria-pressed="true"]{color:var(--hold);background:var(--hold-bg);border-color:var(--hold);font-weight:700}
button.pbtn{min-height:2rem;padding:0 .6rem;font:inherit;font-size:.75rem;line-height:1.5;cursor:pointer;display:inline-flex;align-items:center;gap:0}
button.pbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor;font-weight:700}
.chip{min-height:2rem;padding:0 .75rem;margin:.25rem 0;border-radius:25px;border:1px solid var(--hold);color:var(--hold);background:var(--hold-bg);font-size:.8rem}
.p-master{color:var(--hold);background:var(--hold-bg);border-color:var(--hold)}
.p-open{color:var(--open);border-color:var(--open)}
.p-done{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.p-drift{color:var(--danger);background:var(--danger-bg);border-color:var(--danger)}
.p-edit{color:var(--muted);border-color:var(--rule)}
.meta{color:var(--muted);font-size:.8125rem;margin-top:.25rem;display:flex;flex-wrap:wrap;gap:.25rem 1rem}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .75rem;margin-top:.5rem}
.track{flex:1;min-width:6rem;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.fill{height:100%;background:var(--ok)}
.count{font-variant-numeric:tabular-nums;text-align:right}
.held{font-size:.75rem;padding:0 .4rem;border-radius:4px}
.h-pm{background:var(--hold-bg);color:var(--hold)}
.h-df{background:var(--defer-bg);color:var(--defer);border:1px dashed var(--defer)}
.steps{border-top:1px solid var(--rule);margin-top:.5rem;padding:.5rem 0 0}
.steps.stale{opacity:.5}
.step{padding:.5rem 0}
select{font:inherit;color:inherit;background:var(--panel);border:0;min-height:2.5rem;max-width:12rem}
.step h4{font-size:.9rem;margin:0}
.step button.stephead{width:100%;border:0;background:transparent;padding:0;justify-content:space-between;text-align:left;font-weight:600;font-size:.9rem}
.step button.stephead>.mono,.count{white-space:nowrap;flex:none}
h2{align-items:center}
section.collapsed>:not(h2){display:none}
h2 button.sechead,h3 button.sechead{border:0;background:transparent;padding:0;min-width:2.75rem;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;gap:.6rem}
button.sechead[aria-expanded="true"] .chev{transform:rotate(45deg)}
.countrow{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
#flightn{color:var(--hold);font-weight:700;white-space:nowrap}
.un-group{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:.5rem;padding:.5rem 1rem}
.un-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem .75rem;overflow-wrap:anywhere}
.un-row{margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--rule)}
.un-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;font-size:.9rem;font-weight:600}
.un-top>span:first-child{min-width:0;overflow-wrap:anywhere}
.un-top .stw{flex:none;white-space:nowrap}
.un-blurb{font-size:.8125rem;color:var(--muted);margin-top:.15rem}
.stw{border:1px solid;border-radius:25px;padding:0 .55rem;font-size:.7rem;line-height:1.6;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.stw-done{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.stw-todo{color:var(--muted);border-color:var(--rule)}
.stw-other{color:var(--open);border-color:var(--open)}
.step button.stephead:disabled{color:var(--ink);cursor:default}
.step button.stephead .t{display:inline-flex;align-items:center;gap:.5rem;min-width:0;overflow-wrap:anywhere}
.step button.stephead[aria-expanded="true"] .chev{transform:rotate(45deg)}
.step ul.sumlist{list-style:disc;padding-left:1.25rem;margin:.25rem 0}
.step ul.sumlist li{padding:.125rem 0;font-size:.875rem}
.step ul.sumlist li::before{content:none}
.step .full ul{margin:0;padding-left:1.1rem;list-style:disc}
.step .full li{padding:.125rem 0;font-size:.8125rem}
.step .full li::before{content:none}
.step ul{list-style:none;margin:.25rem 0 0;padding:0}
.step li{font-size:.875rem;padding:.125rem 0 .125rem 1.5rem;position:relative}
.step li::before{content:"\2610";position:absolute;left:0}
.step li.done{color:var(--muted)}.step li.done::before{content:"\2611";color:var(--ok)}
.step li.pm::before{content:"\25F7";color:var(--hold)}
.step li.df{border-left:2px dashed var(--defer);color:var(--defer)}.step li.df::before{content:"~";left:.25rem}
.step code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8em;background:var(--track);border-radius:4px;padding:0 .25rem;overflow-wrap:anywhere}
.step li button.more{border:0;background:transparent;color:var(--hold);min-height:2rem;padding:0 .5rem;margin-left:.25rem;text-decoration:underline;font-size:.8125rem}
.step li .full{margin:.25rem 0 .5rem;padding:.5rem .75rem;border-left:2px solid var(--rule);color:var(--muted);font-size:.8125rem;line-height:1.6;overflow-wrap:anywhere}
.child{font-size:.8125rem;color:var(--muted);margin-top:.25rem}
.derr{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;color:var(--danger)}
.empty{color:var(--muted);padding:1rem;border:1px dashed var(--rule);border-radius:var(--radius)}
.note{font-size:.8125rem;color:var(--defer);background:var(--defer-bg);border:1px dashed var(--defer);border-radius:var(--radius);padding:.35rem .75rem;margin-top:.25rem}
#activity.stale{opacity:.5}
#activity ul.evs{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius)}
#activity li.ev{display:grid;grid-template-columns:3.25rem 1fr;gap:.15rem .75rem;padding:.6rem 1rem;border-top:1px solid var(--rule)}
#activity li.ev:first-child{border-top:0}
#activity li.ev time{grid-row:1/span 3;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:.1rem}
#activity li.ev .pill{white-space:nowrap}
.ev-top{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:center}
.ev-title{font-weight:600}
.ev-step{font-size:.875rem}
.ev-meta{font-size:.8125rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.1rem .75rem}
.ev-meta .was{font-weight:600}
.ev-meta .was-done{color:var(--ok)}
#activity button.showolder{margin-top:1rem;width:100%;justify-content:center}
header{position:relative}
#menu{display:none}
button.icon{padding:0;width:2.75rem;justify-content:center}
button.icon svg{display:block}
#drawer{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel);border-bottom:1px solid var(--rule);box-shadow:0 8px 16px rgba(0,0,0,.25);max-height:75vh;overflow:auto;padding:.5rem .75rem}
#drawer[hidden]{display:none}
#drawer .dhead{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:.25rem 0}
#drawer button.item{width:100%;justify-content:flex-start;border:0;background:transparent}
#drawer button.item[aria-current="true"]{background:var(--track);font-weight:600}
#drawer .dsep{border-top:1px solid var(--rule);margin:.5rem 0}
#drawer .dmeta{font-size:.75rem;margin:.25rem 0 0}
label.tog .k{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.filt{background:var(--track);border-color:transparent}
label.filt select{background:transparent;font-weight:700;color:var(--hold);appearance:none;-webkit-appearance:none;padding-right:.25rem;cursor:pointer}
label.filt .caret{flex:none;width:.5rem;height:.5rem;border-right:2px solid var(--hold);border-bottom:2px solid var(--hold);transform:rotate(45deg);margin:-.2rem .1rem 0 0;pointer-events:none}
label.filt.on{border-color:var(--hold);box-shadow:inset 0 0 0 1px var(--hold)}
button.switch{gap:.6rem}
.switch .sw-track{flex:none;position:relative;width:2.75rem;height:1.5rem;border-radius:999px;background:var(--rule);transition:background .15s}
.switch .sw-thumb{position:absolute;top:.125rem;left:.125rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45);transition:transform .15s}
.switch[aria-checked="true"] .sw-track{background:var(--hold)}
.switch[aria-checked="true"] .sw-thumb{transform:translateX(1.25rem)}
#drawer button.switch{justify-content:space-between}
@media (prefers-reduced-motion:reduce){.switch .sw-track,.switch .sw-thumb{transition:none}}
#ftog{display:none}
#ftog svg{display:block;flex:none}
#ftog[aria-expanded="true"] svg{transform:rotate(180deg)}
#ftog .badge{min-width:1.25rem;padding:0 .35rem;border-radius:999px;background:var(--hold);color:var(--bg);font-size:.75rem;font-weight:700;line-height:1.25rem;text-align:center}
#drawer .drow{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
#drawer button.done{min-height:2.75rem;font-weight:600}
#drawer button.dtoggle{width:100%;justify-content:space-between;border:0;background:transparent;text-align:left}
#drawer button.dtoggle::after{content:"";flex:none;width:.5rem;height:.5rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:.25rem}
#drawer button.dtoggle[aria-expanded="true"]::after{transform:rotate(-135deg)}
#drawer label.tog{display:flex;width:100%;min-height:2.75rem;margin:.25rem 0}
#drawer label.tog input[type=date]{flex:1;min-width:0;min-height:2.5rem}
#drawer .note{margin:.25rem 0}
@media (min-width:641px){#drawer{display:none!important}}
@media (max-width:640px){
header{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.375rem .5rem;padding:.5rem .75rem}
#ftog{display:inline-flex;grid-row:1;grid-column:3;gap:.4rem}
body.fcollapsed #pillbar,body.fcollapsed #chips{display:none}
#menu{display:inline-flex}
h1{grid-row:1;grid-column:2;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{display:contents}
#viewlab,#repolab,#kindlab,#planslab,#stepslab,#rangeg,#th,#updated,#refresh .lbl{display:none}
#refresh{grid-row:1;grid-column:4;padding:0;width:2.75rem;justify-content:center}
#statuslab{display:none}
#pillbar{display:flex;grid-column:1/-1;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.125rem 0 .25rem;scroll-padding-inline:1.25rem}
#pillbar::-webkit-scrollbar{display:none}
#pillbar.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 1.25rem),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 1.25rem),transparent)}
#pillbar.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 1.25rem);mask-image:linear-gradient(to right,transparent,#000 1.25rem)}
#pillbar.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 1.25rem,#000 calc(100% - 1.25rem),transparent);mask-image:linear-gradient(to right,transparent,#000 1.25rem,#000 calc(100% - 1.25rem),transparent)}
main{padding:.5rem .75rem}
.card{padding:.25rem .75rem .75rem}
#activity li.ev{grid-template-columns:2.75rem 1fr;padding:.6rem .75rem;gap:.15rem .5rem}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>
<header>
  <button id="menu" class="icon" type="button" aria-label="Menu" aria-expanded="false" aria-controls="drawer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h1 id="ttl">Plans</h1>
  <button id="ftog" type="button" aria-expanded="true" aria-controls="pillbar" hidden><span>Filters</span><span id="fbadge" class="badge" hidden></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="ctl">
    <label class="tog filt" id="viewlab"><span class="k">View</span> <select id="view"><option value="plans">Plans</option><option value="activity">Activity</option></select><span class="caret" aria-hidden="true"></span></label>
    <label class="tog" id="repolab"><span class="k">Repo</span> <select id="repo"><option value="">All repos</option></select></label>
    <label class="tog" id="kindlab"><span class="k">Type</span> <select id="kind"><option value="">All types</option><option value="master">Master</option><option value="plan">Plan</option></select></label>
    <label class="tog filt" id="planslab" hidden><span class="k">Plans</span> <select id="fplans" aria-describedby="planshelp" title="Events from plans that were open when the event happened. Without git history this means plans open now."><option value="all">All plans</option><option value="open">Open at the time</option></select><span class="caret" aria-hidden="true"></span></label>
    <label class="tog filt" id="stepslab" hidden><span class="k">Steps</span> <select id="fstep"><option value="all">All steps</option><option value="open">Steps open now</option><option value="done">Steps done now</option></select><span class="caret" aria-hidden="true"></span></label>
    <span id="rangeg" role="group" aria-label="Date range" hidden>
      <label class="tog" id="fromlab"><span class="k">From</span> <input type="date" id="from" autocomplete="off"></label>
      <label class="tog" id="tolab"><span class="k">To</span> <input type="date" id="to" autocomplete="off"></label>
    </span>
    <label class="tog filt" id="statuslab"><span class="k">Show</span> <select id="status">
      <option value="all">All plans</option>
      <option value="open">Open</option>
      <option value="started">Started</option>
      <option value="notstarted">Not started</option>
      <option value="completed">Completed</option>
    </select><span class="caret" aria-hidden="true"></span></label>
    <button id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="lbl">Refresh</span></button>
    <span id="updated" class="muted mono"></span>
    <button id="th" class="switch" type="button" role="switch" aria-checked="false"><span class="k">Dark mode</span><span class="sw-track"><span class="sw-thumb"></span></span></button>
  </div>
  <span id="planshelp" class="sr">Events from plans that were open when the event happened</span>
  <div id="pillbar" role="group" aria-label="Filters"></div>
  <nav id="drawer" aria-label="Repos and settings" hidden>
    <div class="drow"><div class="dhead">Menu</div><button id="ddone" class="done" type="button">Done</button></div>
    <button id="tview" class="dtoggle" type="button" aria-expanded="false" aria-controls="dviews"></button>
    <div id="dviews" hidden></div>
    <div class="dsep"></div>
    <button id="trepo" class="dtoggle" type="button" aria-expanded="false" aria-controls="drepos"></button>
    <div id="drepos" hidden></div>
    <div class="dsep"></div>
    <div class="dhead">Type</div>
    <div id="dkinds"></div>
    <div class="dsep"></div>
    <div id="drange">
      <button id="tdate" class="dtoggle" type="button" aria-expanded="true" aria-controls="dbody"></button>
      <div id="dbody" role="group" aria-label="Date range">
        <label class="tog" id="dfromlab"><span class="k">From</span> <input type="date" id="dfrom" autocomplete="off"></label>
        <label class="tog" id="dtolab"><span class="k">To</span> <input type="date" id="dto" autocomplete="off"></label>
        <p id="dconflict" class="note" hidden>From is after To, so no events match.</p>
        <button id="dclear" class="item" type="button">Clear dates</button>
      </div>
      <div class="dsep"></div>
    </div>
    <button id="th2" class="item switch" type="button" role="switch" aria-checked="false"><span>Dark mode</span><span class="sw-track"><span class="sw-thumb"></span></span></button>
    <p id="updated2" class="muted mono dmeta"></p>
  </nav>
</header>
<main>
  <div id="live" aria-live="polite">
    <div class="countrow"><span id="counts"></span><span id="flightn" class="mono"></span></div>
    <div id="chips"></div>
    <div id="banner" class="banner" hidden><span id="bmsg"></span><button id="retry" type="button">Retry</button></div>
    <div id="planshint" class="note" hidden></div>
    <div id="note" class="note" hidden>Git history is unavailable, so only step start and finish times are shown.</div>
    <div id="rangenote" class="note" hidden>From is after To, so no events match.</div>
  </div>
  <div id="list"></div>
  <div id="activity" hidden></div>
</main>
<script>
(function(){
'use strict';
var ST_KEY='plans.status',RP_KEY='plans.repo',TH_KEY='plans.theme',VIEW_KEY='plans.view';

function syncChildren(parent,nodes){
  Array.prototype.slice.call(parent.children).forEach(function(c){if(nodes.indexOf(c)<0){parent.removeChild(c)}});
  for(var i=0;i<nodes.length;i++){
    if(parent.children[i]!==nodes[i]){parent.insertBefore(nodes[i],parent.children[i]||null)}
  }
  while(parent.children.length>nodes.length){parent.removeChild(parent.lastElementChild)}
}

function baseLabel(p){
  if(typeof p.short_title==='string'&&p.short_title){return p.short_title}
  var t=(p.title||'').replace(/`/g,'').trim();
  if(!t){return p.name}
  var cut=t.split(/\s[—–-]\s|:\s/)[0].trim();
  if(cut.length>=12&&cut.charAt(0)!=='/'){t=cut}
  if(t.length>60){var sp=t.lastIndexOf(' ',58);t=t.slice(0,sp>20?sp:58)+'…'}
  return t;
}
function planLabel(p){
  var b=baseLabel(p);
  return dupSet.has(p.repo+'|'+b)?b+' · '+p.name:b;
}
function pct(done,total){
  if(!(total>0)){return 0}
  return Math.max(0,Math.min(100,Math.round(done/total*100)));
}

function ApiError(message,status){this.message=message;this.status=status||0}
async function fetchJson(url,signal){
  var res;
  try{
    res=await fetch(url,{signal:signal,cache:'no-store',headers:{'Accept':'application/json'}});
  }catch(e){
    if(signal.aborted){throw e}
    throw new ApiError('Network or session error. Check your connection or sign in again.');
  }
  if(!res.ok){throw new ApiError('The server answered HTTP '+res.status+'.',res.status)}
  try{
    return await res.json();
  }catch(e){
    if(signal.aborted){throw e}
    throw new ApiError('The response was not JSON. Your session may have expired.');
  }
}

function buildInfo(rec,p){

    row.appendChild(pillBtn('p-master',p.kind,kindFilter===p.kind,function(){setKind(kindFilter===p.kind?'':p.kind)}));
  }else if(p.kind==='orchestrator'){
    row.appendChild(el('span','pill p-master','orchestrator (legacy)'));
  }
  row.appendChild(pillBtn(p.state==='completed'||p.master_open?'p-done':'p-open',p.master_open?'done · master plan open':p.state,statusFilter===p.state,function(){setStatus(statusFilter===p.state?'all':p.state)}));
  row.appendChild(issueNode(p));
  (p.prs||[]).forEach(function(pr){
    if(!isHttps(pr.url)){return}
    var a=el('a','mono prlink'+(pr.done?' prdone':''),'PR #'+pr.number+(pr.done?' ✓':' · in review'));
    a.href=pr.url;a.rel='noopener noreferrer';a.title=pr.repo+' pull request #'+pr.number+(pr.done?' (merged or closed)':' (not merged yet)');
    row.appendChild(a);
  });

  track.setAttribute('aria-valuemin','0');

var SUM_MAX=100,moreSeq=0;
function splitCode(t){
  var out=[],parts=t.split('`');
  parts.forEach(function(p,i){if(p){out.push({c:i%2===1&&i<parts.length-1,s:p})}});
  return out;
}
function splitClauses(t){
  var out=[[]];
  splitCode(t).forEach(function(g){
    if(g.c){out[out.length-1].push(g);return}
    g.s.split(/;\s+|\.\s+(?=[A-Z])/).forEach(function(p,i){
      if(i>0){out.push([])}
      if(p){out[out.length-1].push({c:false,s:p})}
    });
  });
  return out.filter(function(c){return c.length});
}
function summarize(t){
  var segs=splitCode(t),out=[],len=0,cut=false;
  for(var i=0;i<segs.length&&!cut;i++){
    var g=segs[i],end=g.s.length;
    if(g.c){
      if(len>0&&len+end>SUM_MAX){cut=true;break}
      if(end>SUM_MAX){end=SUM_MAX;cut=true}
    }else{
      var m=/[:;]|\.\s/.exec(g.s);
      if(m&&len+m.index>=8){end=m.index;cut=true}
      if(len+end>SUM_MAX){var sp=g.s.lastIndexOf(' ',SUM_MAX-len);end=sp>0?sp:SUM_MAX-len;cut=true}
    }
    out.push({c:g.c,s:end<g.s.length?g.s.slice(0,end).replace(/[\s,]+$/,''):g.s});
    len+=end;
  }
  return {segs:out,cut:cut};
}
function paintSegs(parent,segs){
  segs.forEach(function(g){parent.appendChild(g.c?el('code',null,g.s):document.createTextNode(g.s))});
}
function appendBoxText(li,text){
  var sum=summarize(text);
  var head=el('span','sum');
  paintSegs(head,sum.segs);
  if(!sum.cut){li.appendChild(head);return}
  head.appendChild(document.createTextNode('…'));
  li.appendChild(head);
  var id='more'+(++moreSeq);
  var btn=el('button','more','Details');
  btn.setAttribute('aria-expanded','false');
  btn.setAttribute('aria-controls',id);
  var full=el('div','full');
  full.id=id;full.hidden=true;
  var clauses=splitClauses(text);
  if(clauses.length>1){
    var fl=el('ul');
    clauses.forEach(function(c){var li2=el('li');paintSegs(li2,c);fl.appendChild(li2)});
    full.appendChild(fl);
  }else{
    paintSegs(full,splitCode(text));
  }
  btn.addEventListener('click',function(){
    var show=full.hidden;
    full.hidden=!show;
    btn.setAttribute('aria-expanded',show?'true':'false');
    btn.textContent=show?'Hide':'Details';
  });
  li.appendChild(btn);
  li.appendChild(full);
}

async function loadDetail(rec,trigger){
  if(rec.ctl){rec.ctl.abort()}
  var ctl=new AbortController();rec.ctl=ctl;
  var myReq=++rec.reqId,myGen=gen;
  if(rec.rendered){
    rec.panel.classList.add('stale');rec.panel.setAttribute('aria-busy','true');
  }else if(!rec.errShown){
    rec.panel.replaceChildren(el('div','muted','Loading…'));
  }
  var parts=rec.key.split('/').map(encodeURIComponent).join('/');
  var data;
  try{
    data=await fetchJson('/api/plan/'+parts,ctl.signal);
    if(!data||!Array.isArray(data.steps)){throw new ApiError('The response was not a plan.')}
  }catch(e){
    if(ctl.signal.aborted||myReq!==rec.reqId||myGen!==gen){return}
    var msg=(e instanceof ApiError&&e.status===404)?'This plan moved or was removed. Refresh the list.':'Could not load plan details. '+errText(e);
    showDetailError(rec,msg);
    return;
  }
  if(myReq!==rec.reqId||myGen!==gen){return}
  var active=document.activeElement;
  var moveFocus=trigger==='retry'&&(active===rec.errRetry||active===document.body||!active);
  try{
    renderSteps(rec,data);
  }catch(e){
    showDetailError(rec,'Could not show plan details.');
    return;
  }
  detailCache.set(rec.key,data);
  if(moveFocus){rec.btn.focus()}
}

/* Repo options: Activity offers the union of plan repos and event repos, Plans only plan repos. The stored
   filter stays listed until both relevant loaders succeeded and it is absent (a failed fetch is unknown, not empty). */
function syncRepoOptions(){
  var names=plansRepos.slice();
  if(view==='activity'){activityRepos.forEach(function(n){if(names.indexOf(n)<0){names.push(n)}})}
  var resolved=view==='activity'?(viewState.plans.ok&&viewState.activity.ok):viewState.plans.ok;
  if(repoFilter&&resolved&&names.indexOf(repoFilter)<0){repoFilter='';save(RP_KEY,'');paintKindUi()}
  if(repoFilter&&names.indexOf(repoFilter)<0){names.push(repoFilter)}
  var cur=Array.prototype.slice.call(repoEl.options,1).map(function(o){return o.value});
  if(cur.join('|')!==names.join('|')){
    while(repoEl.options.length>1){repoEl.remove(1)}
    names.forEach(function(n){
      var o=document.createElement('option');o.value=n;o.textContent=n;repoEl.appendChild(o);
    });
  }
  repoEl.value=repoFilter;
  $('ttl').textContent=(view==='activity'?'Activity':'Plans')+(repoFilter?' · '+repoFilter:'');
  var dkey=names.join('|')+'#'+repoFilter;
  if(drawerKey!==dkey){
    drawerKey=dkey;
    var items=[['','All repos']].concat(names.map(function(n){return [n,n]}));
    var nodes=items.map(function(it){
      var b=el('button','item',it[1]);

      b.addEventListener('click',function(){chooseRepo(it[0])});

var inflightSec=homeSection('In flight','inflight'),upnextSec=homeSection('Up next','upnext');
function homeBlocks(inflight,seen){
  var nodes=[];
  if(!inflight.length){return nodes}
  var kids=[],byRepo=new Map();
  inflight.forEach(function(p){
    if(!byRepo.has(p.repo)){byRepo.set(p.repo,[])}
    byRepo.get(p.repo).push(p);
  });
  byRepo.forEach(function(plans,repo){
    var g=flightGroup(repo);
    syncChildren(g.body,cardsFor(plans,null,true,seen));
    g.countEl.textContent=plans.length;
    kids.push(g.head,g.body);
  });
  syncChildren(inflightSec.body,kids);
  inflightSec.countEl.textContent=inflight.length+' started';
  nodes.push(inflightSec);
  var withNext=inflight.filter(function(p){return p.upcoming&&p.upcoming.length});
  if(withNext.length){
    var groups=withNext.map(function(p){
      var g=el('div','un-group');
      var head=el('div','un-head');
      head.appendChild(el('strong',null,planLabel(p)));
      head.appendChild(el('span','muted',p.repo));
      g.appendChild(head);
      p.upcoming.forEach(function(u){
        var row=el('div','un-row');
        var top=el('div','un-top');
        top.appendChild(el('span',null,'Step '+u.n+': '+u.title));
        if(u.status_word){top.appendChild(el('span','mono '+stwCls(u.status_word),u.status_word))}
        row.appendChild(top);
        if(u.blurb){row.appendChild(el('div','un-blurb',u.blurb))}
        if(u.child){row.appendChild(el('div','child','sub-plan '+u.child.repo+'/'+u.child.topic+' · '+u.child.done+'/'+u.child.total))}
        g.appendChild(row);
      });
      return g;
    });
    syncChildren(upnextSec.body,groups);
    upnextSec.countEl.textContent=withNext.length+(withNext.length===1?' plan':' plans');
    nodes.push(upnextSec);
  }
  return nodes;
}
function render(data){
  var seen=new Set(),seenRepos=new Set();
  var nodes=[];
  var shown=0;
  plansRepos=data.repos.map(function(r){return r.repo});
  viewState.plans.ok=true;
  syncRepoOptions();
  var cnt=new Map();
  data.repos.forEach(function(r){r.plans.forEach(function(p){var k=p.repo+'|'+baseLabel(p);cnt.set(k,(cnt.get(k)||0)+1)})});
  dupSet=new Set();
  cnt.forEach(function(n,k){if(n>1){dupSet.add(k)}});
  var home=!repoFilter&&statusFilter==="all"&&!kindFilter;
  var inflight=[];
  if(home){
    data.repos.forEach(function(r){r.plans.forEach(function(p){if(((p.state!=='completed'&&p.done>0&&!p.master_open)||inReview(p))&&matchKind(p)){inflight.push(p)}})});
  }
  var inflightKeys=new Set(inflight.map(planKey));
  shown+=inflight.length;
  nodes=nodes.concat(homeBlocks(inflight,seen));
  data.repos.forEach(function(r){
    if(repoFilter&&r.repo!==repoFilter){return}
    var left=r.plans.filter(function(p){return !inflightKeys.has(planKey(p))});
    if(home&&r.plans.length&&!left.length){return}
    var sec=sections.get(r.repo);
    if(!sec){sec=makeSection(r.repo);sections.set(r.repo,sec)}
    seenRepos.add(r.repo);
    var open=left.filter(function(p){return p.state!=='completed'&&matchStatus(p)&&matchKind(p)});
    var done=left.filter(function(p){return p.state==='completed'&&matchStatus(p)&&matchKind(p)});
    shown+=open.length+done.length;
    sec.countEl.textContent=open.length+' open'+(done.length?' · '+done.length+' completed':'');
    syncChildren(sec.open,cardsFor(open,sec,true,seen));
    syncChildren(sec.done,cardsFor(done,sec,true,seen));
    var kids=[sec.h2];
    if(!open.length&&!done.length){
      sec.empty.textContent=r.plans.length?'No plans match this filter.':'No plans in this repo.';
      kids.push(sec.empty);
    }
    kids.push(sec.open);
    if(done.length){kids.push(sec.compHead);kids.push(sec.done)}
    syncChildren(sec.el,kids);
    sec.paint();
    nodes.push(sec.el);
  });
  cards.forEach(function(rec,key){if(!seen.has(key)){cards.delete(key)}});
  sections.forEach(function(sec,repo){if(!seenRepos.has(repo)){sections.delete(repo)}});
  if(!nodes.length){
    emptyAllEl.textContent=data.repos.length?'No plans match this filter.':'No plans found.';
    nodes.push(emptyAllEl);
  }
  syncChildren(listEl,nodes);
  plansCountsText=shown+(shown===1?' plan':' plans')+(repoFilter?' · '+repoFilter:'');
  var flying=0;
  data.repos.forEach(function(r){
    if(repoFilter&&r.repo!==repoFilter){return}
    r.plans.forEach(function(p){if(p.state!=='completed'&&p.done>0&&!p.master_open&&matchKind(p)){flying++}});
  });
  plansFlightText=flying+' in flight';
  if(view==='plans'){paintPlansCounts()}
}

  }catch(e){
    if(ctl.signal.aborted||id!==listSeq){return}
    fail(errText(e));
    return;
  }

  'created':['Created','p-master'],'implementation-started':['Implementation began','p-master'],'subplan-started':['Sub-plan started','p-master'],
  'step-started':['Step started','p-open'],'review':['Review added','p-open'],
  'step-done':['Step done','p-done'],'subplan-done':['Sub-plan done','p-done'],'completed':['Plan completed','p-done'],
  'edited':['Edited','p-edit'],'progress':['Progress','p-edit'],'artifact':['Artifact added','p-edit'],'reopened':['Reopened','p-edit']
};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var activityData=null,actHistory='ok',actShown=ACT_PAGE,actCollapsed=new Set(),actSeq=0,actCtl=null;
var actLoadingEl=el('div','empty','Loading activity…');
actLoadingEl.setAttribute('aria-busy','true');
function evEpoch(ev){return typeof ev.epoch==='number'?ev.epoch:Date.parse(ev.ts)/1000}
function dayKey(ev){var d=new Date(evEpoch(ev)*1000);return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function dayLabel(ev){
  var d=new Date(evEpoch(ev)*1000),now=new Date(),yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  var k=dayKey(ev),text=DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate()+(d.getFullYear()!==now.getFullYear()?' '+d.getFullYear():'');
  if(k===dayKey({epoch:now.getTime()/1000})){return 'Today · '+text}
  if(k===dayKey({epoch:yest.getTime()/1000})){return 'Yesterday · '+text}
  return text;
}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function matchEvent(ev){
  if(repoFilter&&ev.repo!==repoFilter){return false}
  if(kindFilter==='master'){if(ev.plan_kind!=='master'&&ev.plan_kind!=='orchestrator'){return false}}
  else if(kindFilter&&ev.plan_kind!==kindFilter){return false}
  if(plansFilter==='open'&&ev.state!=='open'){return false}
  if(stepFilter!=='all'&&ev.step_state!==stepFilter){return false}
  if(fromFilter||toFilter){
    if(fromFilter&&toFilter&&fromFilter>toFilter){return false}
    var k=dayKey(ev);
    if(isNaN(evEpoch(ev))){return false}
    if(fromFilter&&k<fromFilter){return false}
    if(toFilter&&k>toFilter){return false}
  }
  return true;
}
/* #rangenote and #planshint are rewritten only when their text or visibility changes, so an unchanged note never touches the #live region. */
function paintActNotes(hasEvents){
  var bad=!!(hasEvents&&fromFilter&&toFilter&&fromFilter>toFilter);
  if(rangeNoteEl.hidden===bad){rangeNoteEl.hidden=!bad}
  ['from','to'].forEach(function(id){
    var n=$(id);
    if(bad){if(n.getAttribute('aria-describedby')!=='rangenote'){n.setAttribute('aria-describedby','rangenote')}}
    else if(n.hasAttribute('aria-describedby')){n.removeAttribute('aria-describedby')}
  });
  var want=hasEvents&&plansFilter==='open'?(actHistory==='unavailable'?'Git history is unavailable, so this shows plans that are open now.':'Showing events from plans that were open when each event happened.'):'';
  if(want&&hintEl.textContent!==want){hintEl.textContent=want}
  if(hintEl.hidden===!!want){hintEl.hidden=!want}
}
function evMarker(ev){
  if(ev.kind==='completed'){return ['now completed',true]}
  if(ev.kind==='reopened'){return ['now open',false]}
  if(ev.state==='open'){return ['was open',false]}
  if(ev.state==='completed'){return ['already completed',true]}
  return ['state unknown',false];
}
function evRow(ev){
  var li=el('li','ev'),d=new Date(evEpoch(ev)*1000);
  var t=el('time',null,two(d.getHours())+':'+two(d.getMinutes()));
  if(ev.ts){t.setAttribute('datetime',String(ev.ts))}
  li.appendChild(t);
  var top=el('div','ev-top'),ui=KIND_UI[ev.kind]||[String(ev.kind),'p-edit'];
  top.appendChild(el('span','pill '+ui[1],ui[0]));
  var title=ev.title||ev.name||ev.topic||'';
  if(ev.plan_kind==='master'||ev.plan_kind==='orchestrator'){title+=' ('+ev.plan_kind+')'}
  top.appendChild(el('span','ev-title',title));
  li.appendChild(top);
  var step=null;
  if(typeof ev.step==='number'){step='Step '+ev.step+(ev.step_title?' · '+ev.step_title:'')}
  else if(ev.detail){step=String(ev.detail).charAt(0).toUpperCase()+String(ev.detail).slice(1)}
  if(step){li.appendChild(el('div','ev-step',step))}
  var meta=el('div','ev-meta'),mk=evMarker(ev);
  meta.appendChild(el('span',null,ev.repo+' · '+ev.topic));
  meta.appendChild(el('span','was'+(mk[1]?' was-done':''),mk[0]));
  li.appendChild(meta);
  return li;
}
function actFocusKey(){
  var a=document.activeElement;
  if(!a||!activityEl.contains(a)){return null}
  if(a.classList.contains('showolder')){return 'showolder'}
  if(a.dataset&&a.dataset.day){return 'day:'+a.dataset.day}
  return null;
}
function dayGroups(list){
  var days=[],cur=null;
  list.forEach(function(ev,i){
    var k=dayKey(ev);
    if(!cur||cur.key!==k){cur={key:k,start:i,items:[]};days.push(cur)}
    cur.items.push(ev);
  });
  return days;
}
function renderActivity(opts){
  if(view!=='activity'){return}
  opts=opts||{};
  var fk=actFocusKey(),sy=window.scrollY,nodes=[],text='',filteredEmpty=false,events=activityData;
  noteEl.hidden=!(events&&actHistory==='unavailable');
  paintActNotes(!!(events&&events.length));
  if(!events){
    if(viewState.activity.pending){nodes.push(actLoadingEl)}
  }else if(!events.length){
    nodes.push(el('div','empty',actHistory==='unavailable'?'No step start or finish times found yet.':'No activity yet. Events appear here as plans are created, worked on and completed.'));
    text='0 events';
  }else{
    var list=events.filter(matchEvent);
    if(!list.length){
      filteredEmpty=true;
      var box=el('div');
      box.appendChild(el('p','empty','No activity matches this filter.'));
      if(stepFilter!=='all'){box.appendChild(el('p','muted','Step filters only show events about a step; git and plan-level events are hidden.'))}
      chipNodes().forEach(function(c){box.appendChild(c)});
      nodes.push(box);
      text='0 of '+events.length+' events';
    }else{
      var n=Math.min(Math.max(actShown,ACT_PAGE),list.length);
      while(n<list.length&&dayKey(list[n])===dayKey(list[n-1])){n++}
      actShown=n;
      var days=dayGroups(list),shownDays=days.filter(function(g){return g.start<n});
      shownDays.forEach(function(g){
        var sec=el('section'),h=el('h2'),b=el('button','sechead'),ul=el('ul','evs'),chev=el('span','chev');
        ul.id='act-'+g.key;
        b.type='button';b.dataset.day=g.key;b.setAttribute('aria-controls',ul.id);
        chev.setAttribute('aria-hidden','true');
        b.appendChild(chev);b.appendChild(el('span',null,dayLabel(g.items[0])));
        h.appendChild(b);h.appendChild(el('span','mono',plural(g.items.length,'event')));
        g.items.forEach(function(ev){ul.appendChild(evRow(ev))});
        sec.appendChild(h);sec.appendChild(ul);
        function paint(){var c=actCollapsed.has(g.key);sec.classList.toggle('collapsed',c);b.setAttribute('aria-expanded',c?'false':'true')}
        b.addEventListener('click',function(){
          if(actCollapsed.has(g.key)){actCollapsed.delete(g.key)}else{actCollapsed.add(g.key)}
          paint();
        });
        paint();
        nodes.push(sec);
      });
      if(n<list.length){
        var firstNew=days[shownDays.length].key,rest=days.length-shownDays.length;
        var more=el('button','showolder','Show older · '+plural(list.length-n,'more event')+' across '+plural(rest,'day'));
        more.type='button';
        more.addEventListener('click',function(){actShown=n+ACT_PAGE;renderActivity({focusDay:firstNew})});
        nodes.push(more);
        text='Showing '+n+' of '+plural(list.length,'event')+' · '+plural(days.length,'day');
      }else if(repoFilter||kindFilter||plansFilter!=='all'||stepFilter!=='all'||fromFilter||toFilter){
        text=list.length+' of '+plural(events.length,'event');
      }else{
        text=plural(list.length,'event')+' · '+plural(days.length,'day');
      }
    }
  }
  chipsEl.hidden=filteredEmpty;
  countsEl.textContent=text;
  activityEl.replaceChildren.apply(activityEl,nodes);
  var f=null;
  if(opts.focusDay){f=activityEl.querySelector('button[data-day="'+opts.focusDay+'"]')}
  else if(fk){
    var a=document.activeElement;
    if(!a||a===document.body||!document.body.contains(a)){
      f=fk==='showolder'?activityEl.querySelector('button.showolder'):activityEl.querySelector('button[data-day="'+fk.slice(4)+'"]');
    }
  }
  if(f){f.focus()}
  if(!opts.focusDay&&Math.abs(window.scrollY-sy)>1){window.scrollTo(0,sy)}
}
async function loadActivity(trigger){
  if(actCtl){actCtl.abort()}
  var ctl=new AbortController();actCtl=ctl;
  var id=++actSeq,vs=viewState.activity;
  vs.pending=true;
  if(view==='activity'){
    activityEl.setAttribute('aria-busy','true');
    if(activityData){activityEl.classList.add('stale')}else{renderActivity()}
  }
  function fail(msg){
    vs.err=msg;vs.pending=false;
    activityEl.removeAttribute('aria-busy');activityEl.classList.remove('stale');
    if(view==='activity'){paintBanner();if(!activityData){renderActivity()}}
  }
  var data;
  try{
    data=await fetchJson('/api/activity',ctl.signal);
    if(!data||!Array.isArray(data.events)){throw new ApiError('The response was not an activity feed.')}
  }catch(e){
    if(ctl.signal.aborted||id!==actSeq){return}
    fail(errText(e));
    return;
  }
  if(id!==actSeq){return}
  var active=document.activeElement;
  var moveFocus=trigger==='retry'&&view==='activity'&&(active===retryBtn||active===document.body||!active);
  activityData=data.events;
  actHistory=data.history==='unavailable'?'unavailable':'ok';
  var seen=new Set();
  activityData.forEach(function(ev){if(ev&&typeof ev.repo==='string'){seen.add(ev.repo)}});
  activityRepos=Array.from(seen).sort();
  vs.ok=true;vs.err=null;vs.pending=false;
  activityEl.removeAttribute('aria-busy');activityEl.classList.remove('stale');
  syncRepoOptions();
  stampUpdated('activity');
  if(view==='activity'){
    paintBanner();
    try{renderActivity()}catch(e){fail('The activity feed could not be displayed.');return}
    if(moveFocus){refreshBtn.focus()}
  }
}

/* ---------- wiring ---------- */
statusEl.addEventListener('change',function(){
  statusFilter=statusEl.value;
  paintFilter();
  save(ST_KEY,statusFilter);
  loadList('toggle');
});
repoEl.addEventListener('change',function(){setRepo(repoEl.value)});
$('fplans').addEventListener('change',function(){setActPlans(this.value)});
$('fstep').addEventListener('change',function(){setActStep(this.value)});
$('from').addEventListener('change',function(){scheduleDate('from',this.value)});
$('to').addEventListener('change',function(){scheduleDate('to',this.value)});
viewEl.addEventListener('change',function(){setView(viewEl.value)});
refreshBtn.addEventListener('click',function(){viewLoader(view)('refresh')});
retryBtn.addEventListener('click',function(){viewLoader(view)('retry')});
loadList('first');
loadActivity('first');
paintView();
})();
</script>
