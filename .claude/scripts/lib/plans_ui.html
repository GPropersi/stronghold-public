<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans</title>
<script>
(function(){try{var t=localStorage.getItem('plans.theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t)}}catch(e){}})();
</script>
<style>
:root{--bg:#f4f6f6;--panel:#fff;--rule:#d5dbdb;--ink:#1f2424;--muted:#566668;--ok:#17702f;--ok-bg:rgba(36,167,69,.12);--open:#a8480a;--hold:#0b6279;--hold-bg:rgba(34,211,238,.14);--defer:#7a5900;--defer-bg:rgba(240,193,90,.14);--danger:#a8222f;--danger-bg:#fdf0f1;--track:#e3e8e8;--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a1a;--panel:#262626;--rule:#3a3a3a;--ink:#e8e8e8;--muted:#a3a3a3;--ok:#4ade80;--ok-bg:rgba(74,222,128,.12);--open:#fb923c;--hold:#22d3ee;--hold-bg:rgba(34,211,238,.12);--defer:#f0c15a;--defer-bg:rgba(240,193,90,.12);--danger:#f87171;--danger-bg:rgba(248,113,113,.12);--track:#3a3a3a}}
:root[data-theme=dark]{--bg:#1a1a1a;--panel:#262626;--rule:#3a3a3a;--ink:#e8e8e8;--muted:#a3a3a3;--ok:#4ade80;--ok-bg:rgba(74,222,128,.12);--open:#fb923c;--hold:#22d3ee;--hold-bg:rgba(34,211,238,.12);--defer:#f0c15a;--defer-bg:rgba(240,193,90,.12);--danger:#f87171;--danger-bg:rgba(248,113,113,.12);--track:#3a3a3a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-wrap:anywhere}
a{color:var(--hold)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8125rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:1rem;border-bottom:1px solid var(--rule);background:var(--panel)}
h1{font-size:1.15rem;margin:0}
.ctl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
button,label.tog{min-height:2.75rem;padding:0 .9rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--open);outline-offset:2px}
label.tog:focus-within{outline:2px solid var(--open);outline-offset:2px}
label.tog input{width:1.1rem;height:1.1rem;margin:0}
main{max-width:60rem;margin:0 auto;padding:1rem}
#live{margin-bottom:.5rem;min-height:1.5rem}
.banner{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.5rem .75rem;margin-top:.25rem;border:1px solid var(--danger);border-radius:var(--radius);background:var(--danger-bg);color:var(--danger)}
h2{font-size:1rem;margin:1.5rem 0 .5rem;display:flex;flex-wrap:wrap;gap:.25rem 1rem;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h3.grp{font-size:.875rem;margin:1rem 0 .5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:.5rem;padding:.25rem 1rem .75rem}
.about{margin:.25rem 0 .5rem;font-size:.9rem;line-height:1.5;color:var(--ink)}
.card{cursor:pointer}
.card .steps,.card .derr{cursor:auto}
.row1{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:center}
.cardbtn{border:0;background:transparent;padding:0;min-width:2.75rem;max-width:100%;text-align:left;overflow-wrap:anywhere;font-weight:600;gap:.5rem}
.cardbtn .nm{min-width:0;overflow-wrap:anywhere}
.chev{flex:none;width:.6rem;height:.6rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.cardbtn[aria-expanded="true"] .chev{transform:rotate(45deg)}
.pill{border:1px solid;border-radius:25px;padding:0 .5rem;font-size:.75rem;line-height:1.5}
#pillbar{display:none}
#pillbar .sep{flex:none;width:1px;background:var(--rule);margin:.25rem .125rem}
button.fpill{flex:none;min-height:2.25rem;padding:0 .9rem;border-radius:25px;font-size:.85rem;white-space:nowrap}
button.fpill[aria-pressed="true"]{color:var(--hold);background:var(--hold-bg);border-color:var(--hold);font-weight:700}
button.pbtn{min-height:2rem;padding:0 .6rem;font:inherit;font-size:.75rem;line-height:1.5;cursor:pointer;display:inline-flex;align-items:center;gap:0}
button.pbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor;font-weight:700}
.chip{min-height:2rem;padding:0 .75rem;margin:.25rem 0;border-radius:25px;border:1px solid var(--hold);color:var(--hold);background:var(--hold-bg);font-size:.8rem}
.p-master{color:var(--hold);background:var(--hold-bg);border-color:var(--hold)}
.p-open{color:var(--open);border-color:var(--open)}
.p-done{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.p-drift{color:var(--danger);background:var(--danger-bg);border-color:var(--danger)}
.meta{color:var(--muted);font-size:.8125rem;margin-top:.25rem;display:flex;flex-wrap:wrap;gap:.25rem 1rem}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .75rem;margin-top:.5rem}
.track{flex:1;min-width:6rem;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.fill{height:100%;background:var(--ok)}
.count{font-variant-numeric:tabular-nums;text-align:right}
.held{font-size:.75rem;padding:0 .4rem;border-radius:4px}
.h-pm{background:var(--hold-bg);color:var(--hold)}
.h-df{background:var(--defer-bg);color:var(--defer);border:1px dashed var(--defer)}
.steps{border-top:1px solid var(--rule);margin-top:.5rem;padding:.5rem 0 0}
.steps.stale{opacity:.5}
.step{padding:.5rem 0}
select{font:inherit;color:inherit;background:var(--panel);border:0;min-height:2.5rem;max-width:12rem}
.step h4{font-size:.9rem;margin:0}
.step button.stephead{width:100%;border:0;background:transparent;padding:0;justify-content:space-between;text-align:left;font-weight:600;font-size:.9rem}
.step button.stephead>.mono,.count{white-space:nowrap;flex:none}
h2{align-items:center}
section.collapsed>:not(h2){display:none}
h2 button.sechead,h3 button.sechead{border:0;background:transparent;padding:0;min-width:2.75rem;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;gap:.6rem}
button.sechead[aria-expanded="true"] .chev{transform:rotate(45deg)}
.countrow{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
#flightn{color:var(--hold);font-weight:700;white-space:nowrap}
.un-group{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:.5rem;padding:.5rem 1rem}
.un-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem .75rem;overflow-wrap:anywhere}
.un-row{margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--rule)}
.un-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;font-size:.9rem;font-weight:600}
.un-top>span:first-child{min-width:0;overflow-wrap:anywhere}
.un-top .stw{flex:none;white-space:nowrap}
.un-blurb{font-size:.8125rem;color:var(--muted);margin-top:.15rem}
.stw{border:1px solid;border-radius:25px;padding:0 .55rem;font-size:.7rem;line-height:1.6;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.stw-done{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.stw-todo{color:var(--muted);border-color:var(--rule)}
.stw-other{color:var(--open);border-color:var(--open)}
.step button.stephead:disabled{color:var(--ink);cursor:default}
.step button.stephead .t{display:inline-flex;align-items:center;gap:.5rem;min-width:0;overflow-wrap:anywhere}
.step button.stephead[aria-expanded="true"] .chev{transform:rotate(45deg)}
.step ul.sumlist{list-style:disc;padding-left:1.25rem;margin:.25rem 0}
.step ul.sumlist li{padding:.125rem 0;font-size:.875rem}
.step ul.sumlist li::before{content:none}
.step .full ul{margin:0;padding-left:1.1rem;list-style:disc}
.step .full li{padding:.125rem 0;font-size:.8125rem}
.step .full li::before{content:none}
.step ul{list-style:none;margin:.25rem 0 0;padding:0}
.step li{font-size:.875rem;padding:.125rem 0 .125rem 1.5rem;position:relative}
.step li::before{content:"\2610";position:absolute;left:0}
.step li.done{color:var(--muted)}.step li.done::before{content:"\2611";color:var(--ok)}
.step li.pm::before{content:"\25F7";color:var(--hold)}
.step li.df{border-left:2px dashed var(--defer);color:var(--defer)}.step li.df::before{content:"~";left:.25rem}
.step code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8em;background:var(--track);border-radius:4px;padding:0 .25rem;overflow-wrap:anywhere}
.step li button.more{border:0;background:transparent;color:var(--hold);min-height:2rem;padding:0 .5rem;margin-left:.25rem;text-decoration:underline;font-size:.8125rem}
.step li .full{margin:.25rem 0 .5rem;padding:.5rem .75rem;border-left:2px solid var(--rule);color:var(--muted);font-size:.8125rem;line-height:1.6;overflow-wrap:anywhere}
.child{font-size:.8125rem;color:var(--muted);margin-top:.25rem}
.derr{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;color:var(--danger)}
.empty{color:var(--muted);padding:1rem;border:1px dashed var(--rule);border-radius:var(--radius)}
header{position:relative}
#menu{display:none}
button.icon{padding:0;width:2.75rem;justify-content:center}
button.icon svg{display:block}
#drawer{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel);border-bottom:1px solid var(--rule);box-shadow:0 8px 16px rgba(0,0,0,.25);max-height:75vh;overflow:auto;padding:.5rem .75rem}
#drawer[hidden]{display:none}
#drawer .dhead{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:.25rem 0}
#drawer button.item{width:100%;justify-content:flex-start;border:0;background:transparent}
#drawer button.item[aria-current="true"]{background:var(--track);font-weight:600}
#drawer .dsep{border-top:1px solid var(--rule);margin:.5rem 0}
#drawer .dmeta{font-size:.75rem;margin:.25rem 0 0}
label.tog .k{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.filt{background:var(--track);border-color:transparent}
label.filt select{background:transparent;font-weight:700;color:var(--hold);appearance:none;-webkit-appearance:none;padding-right:.25rem;cursor:pointer}
label.filt .caret{flex:none;width:.5rem;height:.5rem;border-right:2px solid var(--hold);border-bottom:2px solid var(--hold);transform:rotate(45deg);margin:-.2rem .1rem 0 0;pointer-events:none}
label.filt.on{border-color:var(--hold);box-shadow:inset 0 0 0 1px var(--hold)}
button.switch{gap:.6rem}
.switch .sw-track{flex:none;position:relative;width:2.75rem;height:1.5rem;border-radius:999px;background:var(--rule);transition:background .15s}
.switch .sw-thumb{position:absolute;top:.125rem;left:.125rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45);transition:transform .15s}
.switch[aria-checked="true"] .sw-track{background:var(--hold)}
.switch[aria-checked="true"] .sw-thumb{transform:translateX(1.25rem)}
#drawer button.switch{justify-content:space-between}
@media (prefers-reduced-motion:reduce){.switch .sw-track,.switch .sw-thumb{transition:none}}
@media (min-width:641px){#drawer{display:none!important}}
@media (max-width:640px){
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.375rem .5rem;padding:.5rem .75rem}
#menu{display:inline-flex}
h1{grid-row:1;grid-column:2;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{display:contents}
#repolab,#kindlab,#th,#updated,#refresh .lbl{display:none}
#refresh{grid-row:1;grid-column:3;padding:0;width:2.75rem;justify-content:center}
#statuslab{display:none}
#pillbar{display:flex;grid-column:1/-1;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.125rem 0 .25rem}
#pillbar::-webkit-scrollbar{display:none}
main{padding:.5rem .75rem}
.card{padding:.25rem .75rem .75rem}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>
<header>
  <button id="menu" class="icon" type="button" aria-label="Menu" aria-expanded="false" aria-controls="drawer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h1 id="ttl">Plans</h1>
  <div class="ctl">
    <label class="tog" id="repolab"><span class="k">Repo</span> <select id="repo"><option value="">All repos</option></select></label>
    <label class="tog" id="kindlab"><span class="k">Type</span> <select id="kind"><option value="">All types</option><option value="master">Master</option><option value="plan">Plan</option></select></label>
    <label class="tog filt" id="statuslab"><span class="k">Show</span> <select id="status">
      <option value="all">All plans</option>
      <option value="open">Open</option>
      <option value="started">Started</option>
      <option value="notstarted">Not started</option>
      <option value="completed">Completed</option>
    </select><span class="caret" aria-hidden="true"></span></label>
    <button id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="lbl">Refresh</span></button>
    <span id="updated" class="muted mono"></span>
    <button id="th" class="switch" type="button" role="switch" aria-checked="false"><span class="k">Dark mode</span><span class="sw-track"><span class="sw-thumb"></span></span></button>
  </div>
  <div id="pillbar" role="group" aria-label="Filters"></div>
  <nav id="drawer" aria-label="Repos and settings" hidden>
    <div class="dhead">Repo</div>
    <div id="drepos"></div>
    <div class="dsep"></div>
    <div class="dhead">Type</div>
    <div id="dkinds"></div>
    <div class="dsep"></div>
    <button id="th2" class="item switch" type="button" role="switch" aria-checked="false"><span>Dark mode</span><span class="sw-track"><span class="sw-thumb"></span></span></button>
    <p id="updated2" class="muted mono dmeta"></p>
  </nav>
</header>
<main>
  <div id="live" aria-live="polite">
    <div class="countrow"><span id="counts"></span><span id="flightn" class="mono"></span></div>
    <div id="chips"></div>
    <div id="banner" class="banner" hidden><span id="bmsg"></span><button id="retry" type="button">Retry</button></div>
  </div>
  <div id="list"></div>
</main>
<script>
(function(){
'use strict';
var ST_KEY='plans.status',RP_KEY='plans.repo',TH_KEY='plans.theme';
var STATUSES=["all","open","started","notstarted","completed"];
var KINDS=["master","plan"];
var DONE_WORDS=['done','merged','moved'];
var HELD_LABEL={'done':'Done','open':'Open','post-merge':'Post-merge','manual-post-merge':'Manual post-merge','deferred':'Deferred'};
var BOX_CLASS={'done':'done','open':'','post-merge':'pm','manual-post-merge':'pm','deferred':'df'};

function store(k){try{return localStorage.getItem(k)}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function $(id){return document.getElementById(id)}
function el(tag,cls,text){var n=document.createElement(tag);if(cls){n.className=cls}if(text!=null){n.textContent=String(text)}return n}
function syncChildren(parent,nodes){
  Array.prototype.slice.call(parent.children).forEach(function(c){if(nodes.indexOf(c)<0){parent.removeChild(c)}});
  for(var i=0;i<nodes.length;i++){
    if(parent.children[i]!==nodes[i]){parent.insertBefore(nodes[i],parent.children[i]||null)}
  }
  while(parent.children.length>nodes.length){parent.removeChild(parent.lastElementChild)}
}
var dupSet=new Set();
function baseLabel(p){
  if(typeof p.short_title==='string'&&p.short_title){return p.short_title}
  var t=(p.title||'').replace(/`/g,'').trim();
  if(!t){return p.name}
  var cut=t.split(/\s[—–-]\s|:\s/)[0].trim();
  if(cut.length>=12&&cut.charAt(0)!=='/'){t=cut}
  if(t.length>60){var sp=t.lastIndexOf(' ',58);t=t.slice(0,sp>20?sp:58)+'…'}
  return t;
}
function planLabel(p){
  var b=baseLabel(p);
  return dupSet.has(p.repo+'|'+b)?b+' · '+p.name:b;
}
function pct(done,total){
  if(!(total>0)){return 0}
  return Math.max(0,Math.min(100,Math.round(done/total*100)));
}

var listEl=$('list'),repoEl=$('repo'),statusEl=$('status'),refreshBtn=$('refresh'),thBtn=$('th'),updatedEl=$('updated');
var countsEl=$('counts'),bannerEl=$('banner'),bmsgEl=$('bmsg'),retryBtn=$('retry');

/* ---------- theme ---------- */
var darkQuery=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function effectiveTheme(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t==='dark'||t==='light'){return t}
  return darkQuery&&darkQuery.matches?'dark':'light';
}
var th2Btn=$('th2');
function paintTheme(){
  var dark=effectiveTheme()==='dark'?'true':'false';
  thBtn.setAttribute('aria-checked',dark);th2Btn.setAttribute('aria-checked',dark);
}
function toggleTheme(){
  var next=effectiveTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  save(TH_KEY,next);
  paintTheme();
}
thBtn.addEventListener('click',toggleTheme);
th2Btn.addEventListener('click',toggleTheme);
if(darkQuery&&darkQuery.addEventListener){darkQuery.addEventListener('change',paintTheme)}
paintTheme();

/* ---------- state ---------- */
var statusFilter=STATUSES.indexOf(store(ST_KEY))>=0?store(ST_KEY):'all';
var repoFilter=store(RP_KEY)||'';
statusEl.value=statusFilter;
var STATUS_LABELS=[['all','All'],['open','Open'],['started','Started'],['notstarted','Not started'],['completed','Completed']];
var KIND_LABELS=[['master','Master'],['plan','Plan']];
function paintPillbar(){
  var bar=$('pillbar');
  var kids=STATUS_LABELS.map(function(it){
    var b=el('button','fpill',it[1]);
    b.type='button';
    b.setAttribute('aria-pressed',statusFilter===it[0]?'true':'false');
    b.addEventListener('click',function(){setStatus(it[0])});
    return b;
  });
  kids.push(el('span','sep'));
  KIND_LABELS.forEach(function(it){
    var b=el('button','fpill',it[1]);
    b.type='button';
    b.setAttribute('aria-pressed',kindFilter===it[0]?'true':'false');
    b.addEventListener('click',function(){setKind(kindFilter===it[0]?'':it[0])});
    kids.push(b);
  });
  bar.replaceChildren.apply(bar,kids);
}
function paintFilter(){$('statuslab').classList.toggle('on',statusFilter!=='all');paintPillbar()}
paintFilter();
var stepOpen=new Set();
function needsCompleted(){return statusFilter==='all'||statusFilter==='completed'}
function matchStatus(p){
  if(statusFilter==='completed'){return p.state==='completed'}
  if(statusFilter==='open'){return p.state!=='completed'}
  if(statusFilter==='started'){return p.state!=='completed'&&p.done>0}
  if(statusFilter==='notstarted'){return p.state!=='completed'&&!(p.done>0)}
  return true;
}
var kindFilter=KINDS.indexOf(store('plans.kind'))>=0?store('plans.kind'):'';
var kindEl=$('kind'),chipsEl=$('chips'),dkinds=$('dkinds');
kindEl.value=kindFilter;
function matchKind(p){
  if(!kindFilter){return true}
  if(kindFilter==='master'){return p.kind==='master'||p.kind==='orchestrator'}
  return p.kind===kindFilter;
}
function setKind(v){
  kindFilter=v;kindEl.value=v;save("plans.kind",v);paintKindUi();
  setDrawer(false,false);
  loadList('toggle');
}
function setStatus(v){
  statusFilter=v;statusEl.value=v;paintFilter();save(ST_KEY,v);
  loadList('toggle');
}
kindEl.addEventListener('change',function(){setKind(kindEl.value)});
var chipsKey=null;
function paintKindUi(){
  var key=kindFilter;
  if(chipsKey!==key){
    chipsKey=key;paintPillbar();
    var kids=[];
    if(kindFilter){
      var c=el('button','chip','Type: '+kindFilter+' ×');
      c.type='button';
      c.setAttribute('aria-label','Clear type filter: '+kindFilter);
      c.addEventListener('click',function(){setKind('')});
      kids.push(c);
    }
    chipsEl.replaceChildren.apply(chipsEl,kids);
    var items=[['','All types']].concat(KINDS.map(function(k){return [k,k]}));
    dkinds.replaceChildren.apply(dkinds,items.map(function(it){
      var b=el('button','item',it[1]);
      b.type='button';
      b.setAttribute('aria-current',it[0]===kindFilter?'true':'false');
      b.addEventListener('click',function(){setKind(it[0])});
      return b;
    }));
  }
}
paintKindUi();
var firstLoadDone=false;
var listSeq=0,listCtl=null;
var gen=0;
var detailCache=new Map();
var expanded=new Set();
var cards=new Map();      /* key -> card record */
var sections=new Map();   /* repo -> section record */
var idCounter=0;
var loadingEl=el('p','empty','Loading plans…');
var emptyAllEl=el('div','empty','No plans found.');

/* ---------- fetching ---------- */
function ApiError(message,status){this.message=message;this.status=status||0}
async function fetchJson(url,signal){
  var res;
  try{
    res=await fetch(url,{signal:signal,cache:'no-store',headers:{'Accept':'application/json'}});
  }catch(e){

var SUM_MAX=100,moreSeq=0;
function splitCode(t){
  var out=[],parts=t.split('`');
  parts.forEach(function(p,i){if(p){out.push({c:i%2===1&&i<parts.length-1,s:p})}});
  return out;
}
function splitClauses(t){
  var out=[[]];
  splitCode(t).forEach(function(g){
    if(g.c){out[out.length-1].push(g);return}
    g.s.split(/;\s+|\.\s+(?=[A-Z])/).forEach(function(p,i){
      if(i>0){out.push([])}
      if(p){out[out.length-1].push({c:false,s:p})}
    });
  });
  return out.filter(function(c){return c.length});
}
function summarize(t){
  var segs=splitCode(t),out=[],len=0,cut=false;
  for(var i=0;i<segs.length&&!cut;i++){
    var g=segs[i],end=g.s.length;
    if(g.c){
      if(len>0&&len+end>SUM_MAX){cut=true;break}
      if(end>SUM_MAX){end=SUM_MAX;cut=true}
    }else{
      var m=/[:;]|\.\s/.exec(g.s);
      if(m&&len+m.index>=8){end=m.index;cut=true}
      if(len+end>SUM_MAX){var sp=g.s.lastIndexOf(' ',SUM_MAX-len);end=sp>0?sp:SUM_MAX-len;cut=true}
    }
    out.push({c:g.c,s:end<g.s.length?g.s.slice(0,end).replace(/[\s,]+$/,''):g.s});
    len+=end;
  }
  return {segs:out,cut:cut};
}
function paintSegs(parent,segs){
  segs.forEach(function(g){parent.appendChild(g.c?el('code',null,g.s):document.createTextNode(g.s))});
}
function appendBoxText(li,text){
  var sum=summarize(text);
  var head=el('span','sum');
  paintSegs(head,sum.segs);
  if(!sum.cut){li.appendChild(head);return}
  head.appendChild(document.createTextNode('…'));
  li.appendChild(head);
  var id='more'+(++moreSeq);
  var btn=el('button','more','Details');
  btn.setAttribute('aria-expanded','false');
  btn.setAttribute('aria-controls',id);
  var full=el('div','full');
  full.id=id;full.hidden=true;
  var clauses=splitClauses(text);
  if(clauses.length>1){
    var fl=el('ul');
    clauses.forEach(function(c){var li2=el('li');paintSegs(li2,c);fl.appendChild(li2)});
    full.appendChild(fl);
  }else{

  }
  btn.addEventListener('click',function(){
    var show=full.hidden;

async function loadDetail(rec,trigger){
  if(rec.ctl){rec.ctl.abort()}
  var ctl=new AbortController();rec.ctl=ctl;
  var myReq=++rec.reqId,myGen=gen;
  if(rec.rendered){
    rec.panel.classList.add('stale');rec.panel.setAttribute('aria-busy','true');
  }else if(!rec.errShown){
    rec.panel.replaceChildren(el('div','muted','Loading…'));
  }
  var parts=rec.key.split('/').map(encodeURIComponent).join('/');
  var data;
  try{
    data=await fetchJson('/api/plan/'+parts,ctl.signal);
    if(!data||!Array.isArray(data.steps)){throw new ApiError('The response was not a plan.')}
  }catch(e){
    if(ctl.signal.aborted||myReq!==rec.reqId||myGen!==gen){return}
    var msg=(e instanceof ApiError&&e.status===404)?'This plan moved or was removed. Refresh the list.':'Could not load plan details. '+errText(e);
    showDetailError(rec,msg);
    return;
  }
  if(myReq!==rec.reqId||myGen!==gen){return}
  var active=document.activeElement;
  var moveFocus=trigger==='retry'&&(active===rec.errRetry||active===document.body||!active);
  try{
    renderSteps(rec,data);
  }catch(e){
    showDetailError(rec,'Could not show plan details.');
    return;
  }
  detailCache.set(rec.key,data);
  if(moveFocus){rec.btn.focus()}
}

  cards.forEach(function(rec,key){if(!seen.has(key)){cards.delete(key)}});
  sections.forEach(function(sec,repo){if(!seenRepos.has(repo)){sections.delete(repo)}});
  if(!nodes.length){
    emptyAllEl.textContent=data.repos.length?'No plans match this filter.':'No plans found.';
    nodes.push(emptyAllEl);
  }
  syncChildren(listEl,nodes);
  countsEl.textContent=shown+(shown===1?' plan':' plans')+(repoFilter?' · '+repoFilter:'');
  var flying=0;
  data.repos.forEach(function(r){
    if(repoFilter&&r.repo!==repoFilter){return}
    r.plans.forEach(function(p){if(p.state!=='completed'&&p.done>0&&matchKind(p)){flying++}});
  });
  $('flightn').textContent=flying+' in flight';
}

async function loadList(trigger){
  if(listCtl){listCtl.abort()}
  var ctl=new AbortController();listCtl=ctl;
  var id=++listSeq,want=needsCompleted();
  listEl.setAttribute('aria-busy','true');
  if(!firstLoadDone){syncChildren(listEl,[loadingEl])}
  var data;
  try{
    data=await fetchJson('/api/plans'+(want?'?completed=1':''),ctl.signal);
    if(!data||!Array.isArray(data.repos)){throw new ApiError('The response was not a plan list.')}
  }catch(e){
    if(ctl.signal.aborted||id!==listSeq){return}
    showBanner(errText(e));
    if(!firstLoadDone){syncChildren(listEl,[])}
    listEl.removeAttribute('aria-busy');
    return;
  }
  if(id!==listSeq){return}
  var active=document.activeElement;
  var moveFocus=trigger==='retry'&&(active===retryBtn||active===document.body||!active);
  try{
    render(data);
  }catch(e){
    showBanner('The plan list could not be displayed.');
    if(!firstLoadDone){syncChildren(listEl,[])}
    listEl.removeAttribute('aria-busy');
    return;
  }
  hideBanner();
  firstLoadDone=true;
  stampUpdated();
  gen++;
  detailCache.clear();
  cards.forEach(function(rec){if(rec.open){loadDetail(rec,'refresh')}});
  listEl.removeAttribute('aria-busy');
  if(moveFocus){refreshBtn.focus()}
}

/* ---------- wiring ---------- */
statusEl.addEventListener('change',function(){
  statusFilter=statusEl.value;
  paintFilter();
  save(ST_KEY,statusFilter);
  loadList('toggle');
});
repoEl.addEventListener('change',function(){
  repoFilter=repoEl.value;
  save(RP_KEY,repoFilter);
  loadList('toggle');
});
refreshBtn.addEventListener('click',function(){loadList('refresh')});
retryBtn.addEventListener('click',function(){loadList('retry')});
loadList('first');
})();
</script>
